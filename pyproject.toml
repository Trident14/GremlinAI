[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gremlinai"
version = "0.1.0"
description = "Autonomous AI UAT agent — UAT sign-off in minutes, not days."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.47",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "pillow>=10.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gremlinai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_and_extras/tests"]
