<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="640" cy="380" r="260" fill="url(#glow)"/>
  
  <!-- Browser mockup frame -->
  <rect x="340" y="220" width="600" height="340" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <path d="M 340 264 L 940 264" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Dots -->
  <circle cx="366" cy="242" r="5" fill="#ef4444"/>
  <circle cx="382" cy="242" r="5" fill="#f59e0b"/>
  <circle cx="398" cy="242" r="5" fill="#10b981"/>
  
  <!-- Address bar -->
  <rect x="424" y="232" width="490" height="20" rx="6" fill="rgba(15, 23, 42, 0.6)"/>
  
  <!-- Icon & Message -->
  <g transform="translate(640, 360)">
    <circle cx="0" cy="0" r="36" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5"/>
    <path d="M -12 -8 L -12 10 L 12 10 L 12 -8 Z" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M -8 -8 L -8 -12 Q -8 -16 0 -16 Q 8 -16 8 -12 L 8 -8" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>
  
  <text x="640" y="430" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18">Browser Preview Standby</text>
  <text x="640" y="458" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Enter your URL and user story above, then click Run to stream live execution</text>
</svg>